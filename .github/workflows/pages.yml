name: Build and deploy StickS3 Voice

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome 2026.9.x
        run: python -m pip install "esphome>=2026.9,<2026.10"

      - name: Compile firmware
        run: esphome compile sticks3-voice.yaml

      - name: Locate factory image
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          FACTORY="$(find . -type f -name 'firmware.factory.bin' -print -quit)"
          if [ -z "${FACTORY}" ]; then
            echo "firmware.factory.bin was not produced."
            find . -type f -name '*.bin' -print
            exit 1
          fi
          echo "factory=${FACTORY}" >> "$GITHUB_OUTPUT"
          echo "Using ${FACTORY}"

      - name: Build installer site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/manifest.json _site/manifest.json
          cp "${{ steps.firmware.outputs.factory }}" _site/firmware.factory.bin
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
