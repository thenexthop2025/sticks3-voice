      //
      // Returns max number of lines requested.
      // ======================================================

      auto wrap_utf8 =
        [](const std::string &text,
           int max_width,
           int max_lines) {

          std::vector<std::string> lines;

          std::string current;

          int width = 0;

          size_t i = 0;

          while (i < text.size() &&
                 (int) lines.size() < max_lines) {

            unsigned char c =
              (unsigned char) text[i];

            int bytes = 1;
            int char_width = 7;

            if (c < 0x80) {
              bytes = 1;
              char_width = 7;
            }

            else if ((c & 0xE0) == 0xC0) {
              bytes = 2;
              char_width = 13;
            }

            else if ((c & 0xF0) == 0xE0) {
              bytes = 3;
              char_width = 13;
            }

            else if ((c & 0xF8) == 0xF0) {
              bytes = 4;
              char_width = 13;
            }

            if (i + bytes > text.size()) {
              break;
            }

            if (text[i] == '\n') {

              if (!current.empty()) {
                lines.push_back(current);
                current.clear();
              }

              width = 0;

              i++;

              continue;
            }

            if (width + char_width > max_width) {

              if (!current.empty()) {
                lines.push_back(current);
              }

              current.clear();

              width = 0;

              if ((int) lines.size() >= max_lines) {
                break;
              }
            }

            current.append(
              text.substr(i, bytes)
            );

            width += char_width;

            i += bytes;
          }

          if (!current.empty() &&
              (int) lines.size() < max_lines) {

            lines.push_back(current);
          }

          return lines;
        };


