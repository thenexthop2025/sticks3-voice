# ============================================================
# Global State
# ============================================================

globals:

  # ----------------------------------------------------------
  # Voice State
  #
  # 0 Ready
  # 1 Listening
  # 2 Thinking
  # 3 Speaking
  # 4 Error
  # ----------------------------------------------------------
  - id: voice_state
    type: int
    restore_value: no
    initial_value: "0"


  # false = idle robot animation
  # true  = active Voice UI
  - id: ui_active
    type: bool
    restore_value: no
    initial_value: "false"


  # ----------------------------------------------------------
  # Last speech-to-text result
  # ----------------------------------------------------------
  - id: user_text
    type: std::string
    restore_value: no
    initial_value: '""'


  # ----------------------------------------------------------
  # Last assistant / TTS response
  # ----------------------------------------------------------
  - id: assistant_text
    type: std::string
    restore_value: no
    initial_value: '""'


# ============================================================
# Battery Sensors
#
# M5PM1:
#   0x22 VBAT low byte
#   0x23 VBAT high byte
#
# Battery % is voltage-based estimation.
# ============================================================

sensor:

  # ----------------------------------------------------------
  # Battery voltage
  # ----------------------------------------------------------
  - platform: template
    id: battery_voltage

    name: "StickS3 Battery Voltage"

    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement

    accuracy_decimals: 3

    update_interval: 10s

    lambda: |-
      esphome::i2c::I2CDevice pmic;

      pmic.set_i2c_bus(id(internal_i2c));
      pmic.set_i2c_address(0x6E);

      uint8_t lo = 0;
      uint8_t hi = 0;

      if (!pmic.read_byte(0x22, &lo)) {
        ESP_LOGW("battery", "Failed reading VBAT low byte");
        return NAN;
      }

      if (!pmic.read_byte(0x23, &hi)) {
        ESP_LOGW("battery", "Failed reading VBAT high byte");
        return NAN;
      }

      uint16_t mv =
        ((uint16_t)(hi & 0x0F) << 8) |
        (uint16_t)lo;

      if (mv < 2500 || mv > 5000) {
        ESP_LOGW("battery", "Invalid VBAT: %u mV", mv);
        return NAN;
      }

      return mv / 1000.0f;


  # ----------------------------------------------------------
  # Battery percentage
  #
  # LiPo voltage-based approximation.
  # ----------------------------------------------------------
  - platform: template
    id: battery_level

    name: "StickS3 Battery Level"

    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

    accuracy_decimals: 0

    update_interval: 10s

    lambda: |-
      float v = id(battery_voltage).state;

      if (isnan(v)) {
        return NAN;
      }

      float p = 0.0f;

      // Piecewise LiPo discharge curve approximation.

      if (v >= 4.20f) {
        p = 100.0f;
      }

      else if (v >= 4.10f) {
        p = 90.0f +
            (v - 4.10f) / 0.10f * 10.0f;
      }

      else if (v >= 4.00f) {
        p = 80.0f +
            (v - 4.00f) / 0.10f * 10.0f;
      }

      else if (v >= 3.92f) {
        p = 70.0f +
            (v - 3.92f) / 0.08f * 10.0f;
      }

      else if (v >= 3.85f) {
        p = 60.0f +
            (v - 3.85f) / 0.07f * 10.0f;
      }

      else if (v >= 3.79f) {
        p = 50.0f +
            (v - 3.79f) / 0.06f * 10.0f;
      }

      else if (v >= 3.74f) {
        p = 40.0f +
            (v - 3.74f) / 0.05f * 10.0f;
      }

      else if (v >= 3.68f) {
        p = 30.0f +
            (v - 3.68f) / 0.06f * 10.0f;
      }

      else if (v >= 3.62f) {
        p = 20.0f +
            (v - 3.62f) / 0.06f * 10.0f;
      }

      else if (v >= 3.50f) {
        p = 10.0f +
            (v - 3.50f) / 0.12f * 10.0f;
      }

      else if (v >= 3.30f) {
        p =
          (v - 3.30f) / 0.20f * 10.0f;
      }

      else {
        p = 0.0f;
      }

      if (p < 0.0f)
        p = 0.0f;

      if (p > 100.0f)
        p = 100.0f;

      return p;


  # ----------------------------------------------------------
  # Wi-Fi RSSI
  # ----------------------------------------------------------
  - platform: wifi_signal

    id: wifi_rssi

    name: "StickS3 WiFi Signal"

    update_interval: 30s


# ============================================================
# Display
#
# 135 x 240 portrait
#
# Layout:
#
#   0-31      Header
#   36-92     YOU card
#   98-201    ASSISTANT card
#   207-239   State bar
# ============================================================

display:

  - platform: st7789v

    id: sticks3_display

    spi_id: lcd_spi

    model: "TTGO TDisplay 135x240"

    cs_pin: GPIO41
    dc_pin: GPIO45
    reset_pin: GPIO21
    backlight_pin: GPIO38

    rotation: 0

    update_interval: 500ms

    lambda: |-

      // ======================================================
      // Palette
      // ======================================================

      const auto BG =
        Color(11, 18, 32);

      const auto HEADER =
        Color(15, 27, 46);

      const auto CARD_USER =
        Color(18, 31, 52);

      const auto CARD_AI =
        Color(15, 35, 46);

      const auto BORDER =
        Color(38, 55, 77);

      const auto WHITE =
        Color(238, 244, 255);

      const auto MUTED =
        Color(126, 145, 169);

      const auto BLUE =
        Color(73, 151, 255);

      const auto CYAN =
        Color(56, 211, 200);

      const auto PURPLE =
        Color(168, 111, 255);

      const auto GREEN =
        Color(72, 214, 142);

      const auto YELLOW =
        Color(255, 192, 76);

      const auto RED =
