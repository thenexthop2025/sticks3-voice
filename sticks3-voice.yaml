# ============================================================
# M5Stack StickS3 K150 - Home Assistant Voice Satellite
# ESPHome 2026.9.x
#
# UI version:
#   - Candy-color animated robot while idle
#   - Voice UI appears on front-button press or wake-word detection
#   - Battery %, battery voltage
#   - STT transcript + Assistant reply text
#   - Listening / Thinking / Speaking status
#   - Return to robot about 6 seconds after a completed reply
#   - Noto Sans SC + all 6763 GB2312 Han characters
#
# StickS3 audio:
#   MIC  ES8311 DOUT -> ESP32 GPIO16
#   SPK  ESP32 DOUT  -> ES8311 DIN GPIO14
#   BCLK GPIO17 / LRCK GPIO15 / MCLK GPIO18
# ============================================================


esphome:
  name: sticks3-voice
  friendly_name: StickS3 Voice
  name_add_mac_suffix: true

  project:
    name: sticks3_voice.voice_assistant
    version: "1.0.0"

  on_boot:

    # ----------------------------------------------------------
    # Enable StickS3 L3B/audio rail and speaker amp through M5PM1
    # ----------------------------------------------------------
    - priority: 950
      then:
        - lambda: |-
            ESP_LOGI("sticks3_power", "Initializing M5PM1...");

            esphome::i2c::I2CDevice pmic;
            pmic.set_i2c_bus(id(internal_i2c));
            pmic.set_i2c_address(0x6E);

            uint8_t reg = 0;

            // GPIO2 / GPIO3 -> GPIO function.
            if (!pmic.read_byte(0x16, &reg)) {
              ESP_LOGE("sticks3_power", "Failed reading M5PM1 GPIO_FUNC0");
              return;
            }

            reg &= 0x0F;

            if (!pmic.write_byte(0x16, reg)) {
              ESP_LOGE("sticks3_power", "Failed writing M5PM1 GPIO_FUNC0");
              return;
            }

            // Push-pull for GPIO2 / GPIO3.
            if (!pmic.read_byte(0x13, &reg)) {
              ESP_LOGE("sticks3_power", "Failed reading M5PM1 GPIO_DRV");
              return;
            }

            reg &= ~0x0C;

            if (!pmic.write_byte(0x13, reg)) {
              ESP_LOGE("sticks3_power", "Failed writing M5PM1 GPIO_DRV");
              return;
            }

            // GPIO2 HIGH -> L3B ON
            // GPIO3 HIGH -> speaker amplifier ON
            if (!pmic.read_byte(0x11, &reg)) {
              ESP_LOGE("sticks3_power", "Failed reading M5PM1 GPIO_OUT");
              return;
            }

            reg |= 0x0C;

            if (!pmic.write_byte(0x11, reg)) {
              ESP_LOGE("sticks3_power", "Failed writing M5PM1 GPIO_OUT");
              return;
            }

            if (!pmic.read_byte(0x10, &reg)) {
              ESP_LOGE("sticks3_power", "Failed reading M5PM1 GPIO_MODE");
              return;
            }

            reg |= 0x0C;

            if (!pmic.write_byte(0x10, reg)) {
              ESP_LOGE("sticks3_power", "Failed writing M5PM1 GPIO_MODE");
              return;
            }

            delay(100);

            // Check ES8311
            esphome::i2c::I2CDevice codec;
            codec.set_i2c_bus(id(internal_i2c));
            codec.set_i2c_address(0x18);

            uint8_t codec_reg = 0;

            if (codec.read_byte(0x00, &codec_reg)) {
              ESP_LOGI(
                "sticks3_power",
                "ES8311 detected at 0x18, REG00=0x%02X",
                codec_reg
              );
            } else {
              ESP_LOGE(
                "sticks3_power",
                "ES8311 not responding at 0x18"
              );
            }

    # ----------------------------------------------------------
    # Initial speaker volume
    # ----------------------------------------------------------
    - priority: -200
      then:
        - delay: 1s

        - audio_dac.set_volume:
            id: es8311_codec
            volume: 70%


# ============================================================
# ESP32-S3
# ============================================================

esp32:
  variant: esp32s3
  flash_size: 8MB

  framework:
    type: esp-idf


psram:
  mode: octal
  speed: 80MHz


logger:
  level: DEBUG


# ============================================================
# Home Assistant API
# ============================================================

api:


ota:
  - platform: esphome


wifi:
  power_save_mode: none

  ap:
    ssid: "StickS3 Voice Setup"


improv_serial:


captive_portal:


# ============================================================
# I2C
# ============================================================

i2c:
  id: internal_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz
  scan: true


# ============================================================
# LCD SPI
# ============================================================

spi:
  id: lcd_spi
  clk_pin: GPIO40
  mosi_pin: GPIO39


# ============================================================
# I2S Audio
# ============================================================

i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO18
    i2s_bclk_pin: GPIO17
    i2s_lrclk_pin: GPIO15


# ============================================================
# Fonts
#
# Roboto:
#   UI / labels / battery / status
#
# Noto Sans SC:
#   Chinese + English speech text
#
# NOTE:
# ESPHome embeds glyphs at compile time.
# The Chinese list below contains common conversational /
# smart-home characters to keep the firmware size reasonable.
# ============================================================

font:

  # ----------------------------------------------------------
  # Tiny UI
  # ----------------------------------------------------------
  - file:
      type: gfonts
      family: Roboto
      weight: 500

    id: font_tiny
    size: 10
    bpp: 2


  # ----------------------------------------------------------
  # Small UI
  # ----------------------------------------------------------
  - file:
      type: gfonts
      family: Roboto
      weight: 500

    id: font_small
    size: 12
    bpp: 2


  # ----------------------------------------------------------
  # Status font
  # ----------------------------------------------------------
  - file:
      type: gfonts
      family: Roboto
      weight: 700

    id: font_status
    size: 13
    bpp: 2


  # ----------------------------------------------------------
  # Chinese / assistant text
  #
  # Google Fonts is fetched at COMPILE time.
  # GF_Latin_Kernel covers basic Latin / numbers / whitespace.
  # The glyph list below contains all 6763 GB2312 Han characters,
  # plus common Chinese punctuation.
  # ----------------------------------------------------------
  - file:
      type: gfonts
      family: Noto Sans SC
      weight: 500

    id: font_body
    size: 13
    bpp: 1

