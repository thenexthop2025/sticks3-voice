      );


      // ======================================================
      // Small animation while listening / thinking / speaking
      // ======================================================

      int phase =
        (millis() / 300) % 3;


      if (id(voice_state) == 1) {

        // three listening bars

        for (int n = 0; n < 3; n++) {

          int h =
