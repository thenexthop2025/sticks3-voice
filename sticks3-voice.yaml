# ============================================================
# ES8311 Audio Codec
# ============================================================

audio_dac:

  - platform: es8311

    id: es8311_codec

    i2c_id: internal_i2c

    address: 0x18

    bits_per_sample: 16bit
    sample_rate: 16000

    use_mclk: true

    # StickS3 microphone is ANALOG microphone through ES8311 ADC.
    use_microphone: false

    mic_gain: 42DB


# ============================================================
# ES8311 ADC Re-arm
#
# Needed because codec initialization can happen before
# I2S RX clocks are actually running.
# ============================================================

script:

  # Keep the result visible for 6 seconds, then return to robot.
  - id: return_to_idle
    mode: restart
    then:
      - delay: 6s
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - globals.set:
                id: ui_active
                value: "false"
            - globals.set:
                id: voice_state
                value: "0"


  - id: arm_es8311_adc

    mode: restart

    then:

      - delay: 40ms

      - lambda: |-
          id(es8311_codec).write_byte(
            0x14,
            0x1A
          );

          id(es8311_codec).write_byte(
            0x0E,
            0x02
          );

          id(es8311_codec).write_byte(
            0x0D,
            0x01
          );


      - delay: 40ms

      - lambda: |-
          id(es8311_codec).write_byte(
            0x0D,
            0x01
          );


      - delay: 40ms

      - lambda: |-
          bool ok =
            id(es8311_codec).write_byte(
              0x0D,
              0x01
            );

          uint8_t r0d = 0;
          uint8_t r0e = 0;
          uint8_t r14 = 0;

          id(es8311_codec).read_byte(
            0x0D,
            &r0d
          );

          id(es8311_codec).read_byte(
            0x0E,
            &r0e
          );

          id(es8311_codec).read_byte(
            0x14,
            &r14
          );

          ESP_LOGI(
            "sticks3_audio",
            "ADC arm %s: REG0D=0x%02X REG0E=0x%02X REG14=0x%02X",
            ok ? "OK" : "FAILED",
            r0d,
            r0e,
            r14
          );


# ============================================================
# Microphone
# ============================================================

microphone:

  - platform: i2s_audio

    id: stick_mic

    i2s_audio_id: audio_bus

    i2s_din_pin: GPIO16

    adc_type: external

    pdm: false

    sample_rate: 16000

    bits_per_sample: 16bit

    channel: left


# ============================================================
# Speaker
# ============================================================

speaker:

  - platform: i2s_audio

    id: stick_speaker

    i2s_audio_id: audio_bus

    i2s_dout_pin: GPIO14

    dac_type: external

    audio_dac: es8311_codec

    sample_rate: 16000

    bits_per_sample: 16bit

    channel: mono

    buffer_duration: 500ms

    timeout: 500ms


# ============================================================
# Local Wake Word
# ============================================================

micro_wake_word:

  id: mww

  microphone:
    microphone: stick_mic
    channels: 0
    gain_factor: 2

  models:
    # Keep the original proven wake word.
    - model: hey_jarvis

  vad:


  on_wake_word_detected:

    - script.stop:
        return_to_idle

    - globals.set:
        id: ui_active
        value: "true"

    - globals.set:
        id: voice_state
        value: "1"

    - voice_assistant.start:
        wake_word: !lambda return wake_word;
        silence_detection: true


# ============================================================
# Home Assistant Voice Assistant
# ============================================================

voice_assistant:

  id: va


  microphone:
    microphone: stick_mic
    channels: 0
    gain_factor: 2


  speaker: stick_speaker

  micro_wake_word: mww


  noise_suppression_level: 2

  auto_gain: 20dBFS

  volume_multiplier: 1.0


  # ----------------------------------------------------------
  # HA connected
  # ----------------------------------------------------------
  on_client_connected:

    - globals.set:
        id: voice_state
        value: "0"

    - globals.set:
        id: ui_active
        value: "false"

    - micro_wake_word.start:

    - script.execute:
        arm_es8311_adc


  # ----------------------------------------------------------
  # HA disconnected
  # ----------------------------------------------------------
  on_client_disconnected:

    - micro_wake_word.stop:

    - globals.set:
        id: voice_state
        value: "4"


  # ----------------------------------------------------------
  # Listening starts
  #
  # Clear previous conversation.
  # ----------------------------------------------------------
  on_listening:

    - script.stop:
        return_to_idle

    - globals.set:
        id: ui_active
        value: "true"

    - globals.set:
        id: voice_state
        value: "1"

    - lambda: |-
        id(user_text).clear();
        id(assistant_text).clear();

    - script.execute:
        arm_es8311_adc


  # ----------------------------------------------------------
  # Speech to text complete
  #
  # x = recognized speech
  # ----------------------------------------------------------
  on_stt_end:

    - lambda: |-
        id(user_text) = x;

        ESP_LOGI(
          "voice_ui",
          "USER: %s",
          x.c_str()
        );

    - globals.set:
        id: voice_state
        value: "2"


  # ----------------------------------------------------------
  # TTS starts
  #
  # x = assistant text
  # ----------------------------------------------------------
  on_tts_start:

    - lambda: |-
        id(assistant_text) = x;

        ESP_LOGI(
          "voice_ui",
          "ASSISTANT: %s",
          x.c_str()
        );


  # ----------------------------------------------------------
  # Speaker starts playing TTS
  # ----------------------------------------------------------
  on_tts_stream_start:

    - globals.set:
        id: voice_state
        value: "3"


  # ----------------------------------------------------------
  # Pipeline finished
  #
  # Keep last conversation on display.
  # ----------------------------------------------------------
  on_end:

    - globals.set:
        id: voice_state
        value: "0"

    - wait_until:
        condition:
          not:
            voice_assistant.is_running:

    - micro_wake_word.start:

    - script.execute:
        arm_es8311_adc

    - script.execute:
        return_to_idle


  # ----------------------------------------------------------
  # Error
  # ----------------------------------------------------------
  on_error:

    - globals.set:
        id: voice_state
        value: "4"

    - delay: 2s

    - globals.set:
        id: voice_state
        value: "0"

    - wait_until:
        condition:
          not:
            voice_assistant.is_running:

    - micro_wake_word.start:

    - script.execute:
        arm_es8311_adc

    - script.execute:
        return_to_idle


# ============================================================
# Buttons
#
# Front button = tap-to-talk
#
# Do NOT stop voice assistant when releasing the button.
# ============================================================

binary_sensor:

  # ----------------------------------------------------------
  # Front button
  # ----------------------------------------------------------
  - platform: gpio

    id: front_button

    name: "Front Button"

    pin:
      number: GPIO11

      mode:
        input: true
        pullup: true

      inverted: true


    on_press:

      - if:

          condition:
            voice_assistant.is_running:

          then:

            - voice_assistant.stop:


          else:

            - script.stop:
                return_to_idle

            - micro_wake_word.stop:

            - globals.set:
                id: ui_active
                value: "true"

            - globals.set:
                id: voice_state
                value: "1"

            - voice_assistant.start:
                silence_detection: true


  # ----------------------------------------------------------
  # Side button
  # ----------------------------------------------------------
  - platform: gpio

    id: side_button

    name: "Side Button"

    pin:
      number: GPIO12

      mode:
        input: true
        pullup: true

      inverted: true


  # ----------------------------------------------------------
  # ESPHome connectivity
  # ----------------------------------------------------------
  - platform: status

    name: "StickS3 Status"
